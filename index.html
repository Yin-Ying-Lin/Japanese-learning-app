<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>にほんご べんきょう｜寶貝的日語教室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Zen+Maru+Gothic:wght@400;500;700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8ED;
    --cream-deep:#FBEFD9;
    --ink:#4A4063;
    --ink-soft:#7A6E8C;
    --matcha:#7BA05B;
    --matcha-dark:#5C8045;
    --matcha-light:#CBE0B4;
    --peach:#FF9B71;
    --peach-dark:#E67E52;
    --sun:#FFD166;
    --sun-dark:#F0AE1F;
    --pink:#FFB4B4;
    --pink-dark:#EF8E8E;
    --sky:#8ECDDD;
    --sky-dark:#5CAEC2;
    --plum:#9C7FB0;
    --plum-dark:#7E5F94;
    --nori:#3A3550;
    --radius-lg:32px;
    --radius-md:22px;
    --shadow: 0 6px 0 rgba(74,64,99,0.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(255,209,102,0.35), transparent 40%),
      radial-gradient(circle at 90% 15%, rgba(142,205,221,0.3), transparent 45%),
      var(--cream);
    font-family:'Zen Maru Gothic', 'Kosugi Maru', sans-serif;
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    padding-bottom:40px;
  }
  .jp{font-family:'Kosugi Maru','Zen Maru Gothic',sans-serif;}
  .num{font-family:'Nunito',sans-serif;}

  /* ---------- App shell ---------- */
  .app{max-width:520px; margin:0 auto; padding:18px 16px 10px;}
  header.top{
    display:flex; align-items:center; gap:12px; padding:6px 4px 18px;
  }
  .mascot{width:64px;height:64px; flex-shrink:0; animation: bob 3.2s ease-in-out infinite;}
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-6px) rotate(2deg);} }
  .title-block h1{
    font-family:'Kosugi Maru', sans-serif;
    font-size:22px; margin:0; color:var(--ink); line-height:1.3;
  }
  .title-block p{margin:2px 0 0; font-size:13px; color:var(--ink-soft); font-weight:500;}

  .star-badge{
    margin-left:auto; display:flex; align-items:center; gap:5px;
    background:#fff; border:2px solid var(--sun); border-radius:999px;
    padding:6px 12px; font-family:'Nunito',sans-serif; font-weight:800; color:var(--sun-dark);
    box-shadow:0 3px 0 rgba(240,174,31,0.35);
    font-size:15px;
  }

  /* ---------- Bento grid (home) ---------- */
  .bento{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:12px;
    padding:6px;
    background: var(--nori);
    border-radius: var(--radius-lg);
    box-shadow: 0 10px 0 rgba(58,53,80,0.25), 0 14px 24px rgba(58,53,80,0.25);
  }
  .cell{
    border:none; cursor:pointer; text-align:left;
    border-radius: var(--radius-md);
    padding:16px 14px 14px;
    min-height:118px;
    display:flex; flex-direction:column; justify-content:space-between;
    position:relative; overflow:hidden;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.55);
    transition: transform .12s ease;
  }
  .cell:active{ transform: scale(0.95); }
  .cell .emoji{font-size:34px;}
  .cell .label-jp{font-family:'Kosugi Maru',sans-serif; font-size:17px; margin-top:6px;}
  .cell .label-zh{font-size:12px; color:rgba(74,64,99,0.75); font-weight:500;}
  .cell.big{grid-column: span 2; min-height:96px; flex-direction:row; align-items:center; justify-content:flex-start; gap:14px;}
  .cell.big .emoji{font-size:40px;}
  .c-matcha{background: linear-gradient(160deg, var(--matcha-light), #DCEAC7);}
  .c-peach{background: linear-gradient(160deg, #FFD9C2, #FFC5A3);}
  .c-sun{background: linear-gradient(160deg, #FFEAB0, #FFDD85);}
  .c-pink{background: linear-gradient(160deg, #FFD9D9, var(--pink));}
  .c-sky{background: linear-gradient(160deg, #D3EEF3, var(--sky));}
  .c-plum{background: linear-gradient(160deg, #E7D9EE, #D7BFE3);}
  .c-lav{background: linear-gradient(160deg, #E7DBFF, #CBB2F7);}
  .c-teal{background: linear-gradient(160deg, #C9EEE3, #93D6C4);}
  .c-caramel{background: linear-gradient(160deg, #F3DDB2, #E4BC7C);}

  /* ---------- Detail page ---------- */
  .page{display:none;}
  .page.active{display:block;}
  #home.active{display:block;}
  .backbar{
    display:flex; align-items:center; gap:10px; margin-bottom:14px;
  }
  .back-btn{
    border:none; background:#fff; width:42px;height:42px; border-radius:14px;
    font-size:20px; box-shadow: var(--shadow); cursor:pointer; color:var(--ink);
  }
  .back-btn:active{transform:translateY(3px); box-shadow:none;}
  .page-title{font-family:'Kosugi Maru',sans-serif; font-size:20px; margin:0;}
  .page-title .zh{display:block; font-size:12px; font-family:'Zen Maru Gothic',sans-serif; color:var(--ink-soft); font-weight:500;}

  .quiz-cta{
    display:flex; align-items:center; gap:10px; width:100%;
    border:none; border-radius:20px; padding:14px 16px; margin-bottom:16px;
    background: linear-gradient(135deg, var(--peach), var(--peach-dark));
    color:#fff; font-family:'Kosugi Maru',sans-serif; font-size:16px;
    box-shadow: 0 5px 0 rgba(230,126,82,0.5); cursor:pointer;
  }
  .quiz-cta:active{ transform:translateY(4px); box-shadow:none; }
  .quiz-cta .qe{font-size:24px;}

  .cardgrid{
    display:grid; grid-template-columns: repeat(2, 1fr); gap:12px;
  }
  .word-card{
    background:#fff; border-radius:20px; padding:16px 12px; text-align:center;
    box-shadow: var(--shadow); cursor:pointer; border:3px solid transparent;
    transition: transform .1s ease, border-color .15s ease;
  }
  .word-card:active{transform: scale(0.94);}
  .word-card.playing{border-color: var(--sun); background:#FFFBEE;}
  .word-card .emoji{font-size:38px; display:block;}
  .word-card .jpword{font-family:'Kosugi Maru',sans-serif; font-size:18px; margin-top:8px; color:var(--ink);}
  .word-card .romaji{font-size:11px; color:var(--ink-soft); font-weight:500; margin-top:1px;}
  .word-card .zhword{font-size:12.5px; color:var(--peach-dark); font-weight:700; margin-top:5px;}
  .word-card .speaker{font-size:15px; margin-top:6px; opacity:.55;}
  .word-card .kana-char{font-size:44px; display:block; line-height:1; color:var(--ink);}
  .cardgrid.kana-grid{grid-template-columns: repeat(3, 1fr);}
  .cardgrid.kana-grid .word-card{padding:12px 6px;}
  .cardgrid.kana-grid .romaji{margin-top:4px;}

  /* ---------- Quiz overlay ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(58,53,80,0.55);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
  }
  .overlay.active{display:flex;}
  .sheet{
    background:var(--cream); width:100%; max-width:520px; border-radius:28px 28px 0 0;
    padding:22px 20px 30px; box-shadow: 0 -10px 30px rgba(0,0,0,0.2);
    animation: sheetUp .25s ease;
  }
  @keyframes sheetUp{ from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .sheet-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .sheet-head h3{margin:0; font-family:'Kosugi Maru',sans-serif; font-size:17px;}
  .close-btn{border:none; background:var(--cream-deep); width:36px;height:36px;border-radius:12px; font-size:16px; cursor:pointer;}
  .quiz-progress{font-size:12px; color:var(--ink-soft); margin-bottom:14px; font-weight:600;}
  .replay-row{display:flex; justify-content:center; margin:10px 0 20px;}
  .replay-btn{
    border:none; width:88px; height:88px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--sky));
    box-shadow: 0 6px 0 var(--sky-dark); font-size:34px; cursor:pointer;
  }
  .replay-btn:active{ transform:translateY(5px); box-shadow:none; }
  .options{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .opt{
    background:#fff; border:3px solid transparent; border-radius:18px; padding:14px 4px;
    text-align:center; font-size:34px; cursor:pointer; box-shadow: var(--shadow);
  }
  .opt:active{transform:scale(0.92);}
  .opt.correct{border-color:var(--matcha); background:#EAF5E1;}
  .opt.wrong{border-color:var(--pink-dark); background:#FFEAEA;}
  .quiz-feedback{
    text-align:center; margin-top:16px; min-height:28px; font-family:'Kosugi Maru',sans-serif;
    font-size:16px; font-weight:700;
  }
  .quiz-feedback.good{color:var(--matcha-dark);}
  .quiz-feedback.bad{color:var(--peach-dark);}

  .bubble{
    position:fixed; left:50%; top:14px; transform:translateX(-50%);
    background:var(--nori); color:#fff; padding:9px 16px; border-radius:999px;
    font-family:'Kosugi Maru',sans-serif; font-size:14px; z-index:60;
    box-shadow:0 6px 14px rgba(0,0,0,0.25);
    opacity:0; pointer-events:none; transition: opacity .3s ease, transform .3s ease;
  }
  .bubble.show{opacity:1; transform:translateX(-50%) translateY(6px);}

  .install-tip{
    margin-top:24px; background:#fff; border-radius:20px; padding:14px 16px;
    box-shadow: var(--shadow); font-size:12.5px; color:var(--ink-soft); line-height:1.6;
  }
  .install-tip b{color:var(--ink); font-family:'Kosugi Maru',sans-serif; font-weight:400;}
</style>
</head>

<div class="bubble" id="bubble"></div>

<div class="app">

  <!-- HOME -->
  <div class="page active" id="home">
    <header class="top">

        <path d="M50 8 L92 88 L8 88 Z" fill="#FFFDF7" stroke="#EADFC4" stroke-width="2"/>

        <circle cx="62" cy="52" r="4" fill="#4A4063"/>

      <div class="title-block">

        <p>幼稚園寶貝的日語練習教室</p>
      </div>
      <div class="star-badge">⭐ <span id="starCount" class="num">0</span></div>
    </header>

    <nav class="bento" id="bentoGrid"></nav>

    <div class="install-tip">
      📱 <b>加到手機主畫面：</b>用手機瀏覽器打開這個頁面連結後，iPhone 請按下方「分享」→「加入主畫面」；Android 請按右上角選單→「新增至主畫面」，就會出現一個可愛的日文 App 圖示囉！
    </div>
  </div>

  <!-- CATEGORY DETAIL -->
  <div class="page" id="detail">
    <div class="backbar">
      <button class="back-btn" onclick="goHome()">←</button>
      <div>
        <h2 class="page-title jp" id="detailTitleJp"></h2>

    <button class="quiz-cta" onclick="startQuiz()">
      <span class="qe">🎧</span>
      <span>聽力小遊戲：考考我！</span>
    </button>
    <div class="cardgrid" id="cardGrid"></div>
  </div>

</div>

<!-- QUIZ OVERLAY -->
<div class="overlay" id="quizOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <h3 class="jp">🎧 きいて タッチ！</h3>
      <button class="close-btn" onclick="closeQuiz()">✕</button>
    </div>
    <div class="quiz-progress" id="quizProgress"></div>
    <div class="replay-row">
      <button class="replay-btn" id="replayBtn" onclick="playCurrentQuizAudio()">🔊</button>
    </div>
    <div class="options" id="quizOptions"></div>
    <div class="quiz-feedback" id="quizFeedback"></div>
  </div>
</div>

      {jp:'ぎゅうにゅう', romaji:'gyūnyū', zh:'牛奶', emoji:'🥛'},
      {jp:'みず', romaji:'mizu', zh:'水', emoji:'💧'},
      {jp:'おかし', romaji:'okashi', zh:'點心', emoji:'🍬'},
    ]},
  { id:'body', jp:'からだ', zh:'身體部位', emoji:'🙂', color:'c-pink',
    items:[
      {jp:'あたま', romaji:'atama', zh:'頭', emoji:'🧠'},
      {jp:'め', romaji:'me', zh:'眼睛', emoji:'👀'},
      {jp:'はな', romaji:'hana', zh:'鼻子', emoji:'👃'},
      {jp:'くち', romaji:'kuchi', zh:'嘴巴', emoji:'👄'},
      {jp:'みみ', romaji:'mimi', zh:'耳朵', emoji:'👂'},
      {jp:'て', romaji:'te', zh:'手', emoji:'🖐️'},
      {jp:'あし', romaji:'ashi', zh:'腳', emoji:'🦶'},
      {jp:'おなか', romaji:'onaka', zh:'肚子', emoji:'🫃'},
    ]},
  { id:'family', jp:'かぞく', zh:'家人', emoji:'👪', color:'c-matcha', big:true,
    items:[
      {jp:'おかあさん', romaji:'okāsan', zh:'媽媽', emoji:'👩'},
      {jp:'おとうさん', romaji:'otōsan', zh:'爸爸', emoji:'👨'},
      {jp:'おじいさん', romaji:'ojīsan', zh:'爺爺/外公', emoji:'👴'},
      {jp:'おばあさん', romaji:'obāsan', zh:'奶奶/外婆', emoji:'👵'},
      {jp:'おにいさん', romaji:'onīsan', zh:'哥哥', emoji:'🧑'},
      {jp:'おねえさん', romaji:'onēsan', zh:'姊姊', emoji:'👧'},
      {jp:'あかちゃん', romaji:'akachan', zh:'小寶寶', emoji:'👶'},
    ]},
];

/* ---------------- State ---------------- */
let stars = 0;
let currentCategory = null;
let quizPool = [];
let quizIndex = 0;
let quizCorrect = 0;
const QUIZ_LEN = 5;

/* ---------------- Storage (persists in this browser via localStorage) ---------------- */
function loadStars(){
  try{
    const v = window.localStorage.getItem('jp-app:stars');
    stars = v ? parseInt(v, 10) || 0 : 0;
  }catch(e){ stars = 0; }
  document.getElementById('starCount').textContent = stars;
}
function saveStars(){
  try{ window.localStorage.setItem('jp-app:stars', String(stars)); }
  catch(e){ /* ignore silently, keep session progress */ }
}
function addStars(n){
  stars += n;
  document.getElementById('starCount').textContent = stars;
  saveStars();
}

/* ---------------- Speech ---------------- */
let jpVoice = null;
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  jpVoice = voices.find(v => v.lang === 'ja-JP') || voices.find(v => v.lang && v.lang.startsWith('ja')) || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text, onend){
  if(!('speechSynthesis' in window)){
    if(onend) onend();
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  if(jpVoice) u.voice = jpVoice;
  u.rate = 0.82;
  u.pitch = 1.05;
  if(onend) u.onend = onend;
  speechSynthesis.speak(u);
}

/* ---------------- Bubble toast ---------------- */
let bubbleTimer = null;
function showBubble(msg){
  const b = document.getElementById('bubble');
  b.textContent = msg;
  b.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(()=> b.classList.remove('show'), 1800);
}

/* ---------------- Home / navigation ---------------- */
function renderHome(){
  const grid = document.getElementById('bentoGrid');
  grid.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const btn = document.createElement('button');
    btn.className = 'cell ' + cat.color + (cat.big ? ' big' : '');
    btn.innerHTML = `<span class="emoji">${cat.emoji}</span>
      <span>
        <span class="label-jp jp">${cat.jp}</span><br>
        <span class="label-zh">${cat.zh}</span>
      </span>`;
    btn.onclick = ()=> openCategory(cat.id);
    grid.appendChild(btn);
  });
}

function openCategory(id){
  currentCategory = CATEGORIES.find(c=>c.id===id);
  document.getElementById('detailTitleJp').textContent = currentCategory.emoji + ' ' + currentCategory.jp;
  document.getElementById('detailTitleZh').textContent = currentCategory.zh;
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  grid.classList.toggle('kana-grid', currentCategory.type === 'kana');
  currentCategory.items.forEach(item=>{
    const card = document.createElement('div');
    card.className = 'word-card';
    card.innerHTML = (currentCategory.type === 'kana') ? `
      <span class="kana-char jp">${item.jp}</span>
      <div class="romaji">${item.romaji}</div>
      <div class="speaker">🔊</div>
    ` : `
      <span class="emoji">${item.emoji}</span>
      <div class="jpword jp">${item.jp}</div>
      <div class="romaji">${item.romaji}</div>
      <div class="zhword">${item.zh}</div>
      <div class="speaker">🔊 點我聽聽看</div>
    `;
    card.onclick = ()=>{
      document.querySelectorAll('.word-card.playing').forEach(c=>c.classList.remove('playing'));
      card.classList.add('playing');
      speak(item.jp, ()=> card.classList.remove('playing'));
    };
    grid.appendChild(card);
  });
  document.getElementById('home').classList.remove('active');
  document.getElementById('detail').classList.add('active');
}

function goHome(){
  document.getElementById('detail').classList.remove('active');
  document.getElementById('home').classList.add('active');
}

/* ---------------- Quiz ---------------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startQuiz(){
  if(!currentCategory || currentCategory.items.length < 3) return;
  const len = Math.min(QUIZ_LEN, currentCategory.items.length);
  quizPool = shuffle(currentCategory.items).slice(0, len);
  quizIndex = 0;
  quizCorrect = 0;
  document.getElementById('quizOverlay').classList.add('active');
  loadQuizQuestion();
}

function closeQuiz(){
  document.getElementById('quizOverlay').classList.remove('active');
  speechSynthesis.cancel();
}

function loadQuizQuestion(){
  const target = quizPool[quizIndex];
  document.getElementById('quizProgress').textContent = `第 ${quizIndex+1} / ${quizPool.length} 題`;
  document.getElementById('quizFeedback').textContent = '';
  document.getElementById('quizFeedback').className = 'quiz-feedback';

  // build 3 options: target + 2 distractors from same category
  const others = shuffle(currentCategory.items.filter(i=> i.jp !== target.jp)).slice(0,2);
  const options = shuffle([target, ...others]);

  const optWrap = document.getElementById('quizOptions');
  optWrap.innerHTML = '';
  options.forEach(opt=>{
    const el = document.createElement('button');
    el.className = 'opt jp';
    el.textContent = opt.emoji || opt.jp;
    el.onclick = ()=> answerQuiz(opt, target, el);
    optWrap.appendChild(el);
  });

  playCurrentQuizAudio();
}

function playCurrentQuizAudio(){
  if(quizPool[quizIndex]) speak(quizPool[quizIndex].jp);
}

function answerQuiz(chosen, target, el){
  const buttons = document.querySelectorAll('#quizOptions .opt');
  buttons.forEach(b=> b.onclick = null);
  const fb = document.getElementById('quizFeedback');
  if(chosen.jp === target.jp){
    el.classList.add('correct');
    fb.textContent = '🎉 正解！すごい！(答對了，好棒！)';
    fb.className = 'quiz-feedback good';
    quizCorrect++;
    addStars(1);
    showBubble('がんばれ！ 加油！');
  }else{
    el.classList.add('wrong');
    const targetDisplay = target.emoji || target.jp;
    buttons.forEach(b=>{ if(b.textContent === targetDisplay) b.classList.add('correct'); });
    fb.textContent = `再試試看～ 正確答案是 ${targetDisplay}`;
    fb.className = 'quiz-feedback bad';
  }
  setTimeout(()=>{
    quizIndex++;
    if(quizIndex < quizPool.length){
      loadQuizQuestion();
    }else{
      finishQuiz();
    }
  }, 1400);
}

function finishQuiz(){
  const fb = document.getElementById('quizFeedback');
  document.getElementById('quizOptions').innerHTML = '';
  document.getElementById('quizProgress').textContent = '完成！';
  fb.className = 'quiz-feedback good';
  fb.innerHTML = `🏅 全部答完！答對 ${quizCorrect} / ${quizPool.length} 題<br><br>
    <button class="quiz-cta" style="margin-top:10px;" onclick="startQuiz()">再玩一次 🔁</button>`;
  if(quizCorrect === quizPool.length){
    addStars(2);
    showBubble('パーフェクト！ 完美過關！');
  }
}

/* ---------------- Init ---------------- */
renderHome();
loadStars();
</script>
